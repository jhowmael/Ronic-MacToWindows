name: Release

# Publishes the download to GitHub Releases when a "v*" tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# Can also be run manually (builds the workflow artifact only, no Release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Package (universal arm64 + x86_64)
        run: UNIVERSAL=1 ./scripts/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/RonicMacToWindows-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: Ronic MacToWindows ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Download
            | System | File |
            |---|---|
            | macOS 14 Sonoma or later (Apple Silicon and Intel) | **RonicMacToWindows-macOS.zip** |

            Installation and the full shortcut list: see the [README](https://github.com/jhowmael/Ronic-MacToWindows#installation).
          files: |
            dist/RonicMacToWindows-macOS.zip
